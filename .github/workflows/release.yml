name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Publish tiders-x402-server
        run: |
          set -o pipefail
          if cargo publish -p tiders-x402-server 2>&1 | tee /tmp/publish-server.log; then
            echo "Published tiders-x402-server"
          elif grep -q "already exists on crates.io index\|already uploaded" /tmp/publish-server.log; then
            echo "tiders-x402-server version already published, skipping"
          else
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-cli-linux:
    runs-on: ${{ matrix.platform.runner }}
    needs: [publish-crates]
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build CLI wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter python3.12 --zig
          working-directory: cli-python
          manylinux: auto
      - name: Upload CLI wheel
        uses: actions/upload-artifact@v5
        with:
          name: cli-wheels-linux-${{ matrix.platform.target }}
          path: cli-python/dist

  publish-cli-macos:
    runs-on: ${{ matrix.platform.runner }}
    needs: [publish-crates]
    strategy:
      matrix:
        platform:
          - runner: macos-14
            target: aarch64
          - runner: macos-15
            target: x86_64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build CLI wheel
        uses: PyO3/maturin-action@v1
        env:
          CARGO_BUILD_JOBS: "2"
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter python3.12
          working-directory: cli-python
      - name: Upload CLI wheel
        uses: actions/upload-artifact@v5
        with:
          name: cli-wheels-macos-${{ matrix.platform.target }}
          path: cli-python/dist

  publish-cli-windows:
    runs-on: windows-2022
    needs: [publish-crates]
    continue-on-error: true
    strategy:
      matrix:
        platform:
          - target: x86_64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build CLI wheel
        uses: PyO3/maturin-action@v1
        env:
          CARGO_BUILD_JOBS: "1"
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter python3.12
          working-directory: cli-python
      - name: Upload CLI wheel
        uses: actions/upload-artifact@v5
        with:
          name: cli-wheels-windows-${{ matrix.platform.target }}
          path: cli-python/dist

  upload-cli-pypi:
    name: Publish CLI to PyPI (tiders-x402-server)
    runs-on: ubuntu-latest
    needs: [publish-cli-linux, publish-cli-macos, publish-cli-windows]
    if: ${{ always() && needs.publish-cli-linux.result == 'success' && needs.publish-cli-macos.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: cli-wheels-*
      - name: Install maturin
        run: pip install maturin
      - name: Publish CLI to PyPI
        run: maturin upload --skip-existing cli-wheels-*/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
